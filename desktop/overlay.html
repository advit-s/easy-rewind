<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Easy Rewind</title>
    <link rel="stylesheet" href="overlay.css" />
    <script src="overlay.js" defer></script>
  </head>
  <body>
    <main class="overlay-shell">
      <header class="titlebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">ER</div>
          <div>
            <h1>Easy Rewind</h1>
            <p>Capture now. Recall when it matters.</p>
          </div>
        </div>
        <button class="icon-button" id="close-button" type="button" aria-label="Close overlay">×</button>
      </header>

      <section class="search" aria-labelledby="search-label">
        <label id="search-label" for="search-input">Search your memory</label>
        <div class="search-row">
          <input
            id="search-input"
            type="search"
            maxlength="512"
            placeholder="A topic, phrase, or idea…"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="primary-button search-button" id="search-button" type="button">Search</button>
        </div>
      </section>

      <nav class="mode-tabs" aria-label="Overlay views">
        <button class="mode-tab active" type="button" data-panel="capture-panel" aria-selected="true">
          Quick capture
        </button>
        <button class="mode-tab" type="button" data-panel="recent-panel" aria-selected="false">Recent</button>
      </nav>

      <section class="panel active" id="capture-panel" aria-labelledby="capture-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Inbox</p>
            <h2 id="capture-heading">Save a thought</h2>
          </div>
          <span class="shortcut">Ctrl + Enter</span>
        </div>
        <label class="visually-hidden" for="note-input">Thought to save</label>
        <textarea id="note-input" maxlength="100000" placeholder="Write the thought before it slips away…"></textarea>
        <button class="primary-button capture-button" id="save-note-button" type="button">Save thought</button>
        <p class="status" id="capture-status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel" id="recent-panel" aria-labelledby="recent-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Last touched</p>
            <h2 id="recent-heading">Recent memories</h2>
          </div>
          <button class="text-button" id="refresh-button" type="button">Refresh</button>
        </div>
        <div class="result-list" id="recent-list" aria-live="polite"></div>
      </section>

      <section class="search-results" id="search-results" aria-labelledby="results-heading" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Recall</p>
            <h2 id="results-heading">Search results</h2>
          </div>
          <button class="text-button" id="clear-results-button" type="button">Clear</button>
        </div>
        <div class="result-list" id="search-result-list" aria-live="polite"></div>
      </section>

      <p class="status global-status" id="global-status" role="status" aria-live="polite"></p>
      <footer><kbd>Esc</kbd> closes the overlay</footer>
    </main>
  </body>
</html>
