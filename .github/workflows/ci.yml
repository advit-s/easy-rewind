name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-1:
    name: Stage 1 hygiene and workspace
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        # Official GitHub-maintained action: checkout v4.3.0, pinned to its immutable release SHA.
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        # Official GitHub-maintained action: setup-node v4.4.0, pinned to its immutable release SHA.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact npm
        run: npm install --global npm@11.6.2 --ignore-scripts --no-audit --no-fund

      - name: Verify exact toolchain
        shell: pwsh
        run: |
          if ((node --version) -ne 'v24.18.0') { throw 'Unexpected Node version' }
          if ((npm --version) -ne '11.6.2') { throw 'Unexpected npm version' }

      - name: Install exact root dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Scan tracked source for secrets
        run: npm run scan:secrets

      - name: Check repository hygiene
        run: npm run check:hygiene

      - name: Run workspace contract tests
        run: npm run test:workspace

      - name: Run containment tests
        run: npm run test:containment

      - name: Run hygiene tests
        run: npm run test:hygiene

      - name: Lint with zero warnings
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run backend tests against disposable storage
        run: npm run test:backend:legacy-safe

      - name: Run Stage 1 build validation
        run: npm run build
