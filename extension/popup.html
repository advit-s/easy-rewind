<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy Rewind</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
        --paper: #f5f1e8;
        --paper-deep: #e9e1d2;
        --ink: #172a3a;
        --ink-soft: #566777;
        --blue: #315b7d;
        --blue-deep: #20435f;
        --copper: #c86a3a;
        --sage: #b9c5aa;
        --red: #a33a32;
        --line: rgba(23, 42, 58, 0.15);
        --shadow: 0 16px 44px rgba(23, 42, 58, 0.17);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 390px;
        min-height: 500px;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(rgba(49, 91, 125, 0.04) 1px, transparent 1px) 0 0 / 100% 24px,
          var(--paper);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid rgba(200, 106, 58, 0.42);
        outline-offset: 3px;
      }

      .shell {
        min-height: 500px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .rewind-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(23, 42, 58, 0.22);
        border-radius: 50%;
        background: var(--paper);
        box-shadow: inset 0 0 0 5px var(--paper-deep);
        color: var(--blue-deep);
        font:
          700 17px/1 Georgia,
          serif;
      }

      .brand-name,
      .eyebrow,
      .connection-label {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.13em;
      }

      .brand-name {
        font-size: 12px;
        font-weight: 750;
      }

      .brand-subtitle {
        margin: 2px 0 0;
        color: var(--ink-soft);
        font-size: 11px;
      }

      .privacy-flag {
        padding: 5px 8px;
        border: 1px solid rgba(49, 91, 125, 0.2);
        border-radius: 999px;
        background: rgba(185, 197, 170, 0.28);
        color: var(--blue-deep);
        font:
          650 10px/1.2 'Segoe UI Variable',
          'Segoe UI',
          sans-serif;
      }

      .track {
        height: 4px;
        display: grid;
        grid-template-columns: 1fr 14px 1fr;
        align-items: center;
        color: var(--copper);
      }

      .track::before,
      .track::after {
        content: '';
        height: 1px;
        background: currentColor;
        opacity: 0.46;
      }

      .track-dot {
        width: 8px;
        height: 8px;
        justify-self: center;
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 1px currentColor;
      }

      .state-card {
        position: relative;
        min-height: 260px;
        padding: 24px;
        overflow: hidden;
        border: 1px solid rgba(23, 42, 58, 0.14);
        border-radius: 22px 22px 22px 7px;
        background: rgba(255, 253, 248, 0.9);
        box-shadow: var(--shadow);
      }

      .state-card::after {
        content: '';
        position: absolute;
        right: -46px;
        top: -52px;
        width: 136px;
        height: 136px;
        border: 24px solid rgba(49, 91, 125, 0.07);
        border-radius: 50%;
        pointer-events: none;
      }

      .eyebrow {
        color: var(--copper);
        font:
          700 10px/1.3 'Segoe UI Variable',
          'Segoe UI',
          sans-serif;
      }

      .state-title {
        max-width: 275px;
        margin: 10px 0 8px;
        font:
          600 31px/1.02 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.025em;
      }

      .state-description {
        max-width: 285px;
        margin: 0;
        color: var(--ink-soft);
        font-size: 13px;
        line-height: 1.55;
      }

      .page-summary {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .page-summary[hidden],
      .connection-form[hidden],
      .capture-control[hidden] {
        display: none;
      }

      .page-kicker {
        margin: 0 0 3px;
        color: var(--ink-soft);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .page-title {
        max-width: 260px;
        margin: 0;
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-link {
        margin-top: 9px;
        padding: 0;
        border: 0;
        border-bottom: 1px solid currentColor;
        background: transparent;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
      }

      .actions {
        min-height: 36px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .action-button {
        min-height: 36px;
        padding: 8px 14px;
        border: 0;
        border-radius: 10px 10px 10px 3px;
        background: var(--blue);
        color: #fffdf8;
        font-size: 12px;
        font-weight: 720;
        box-shadow: 0 7px 18px rgba(49, 91, 125, 0.2);
      }

      .action-button:hover {
        background: var(--blue-deep);
      }

      .connection-form {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }

      .connection-form label {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-soft);
        font-size: 11px;
        font-weight: 700;
      }

      .connection-row {
        display: flex;
        align-items: stretch;
        gap: 8px;
      }

      .connection-input {
        min-width: 0;
        flex: 1 1 auto;
        padding: 9px 10px;
        border: 1px solid rgba(23, 42, 58, 0.24);
        border-radius: 9px;
        background: #fffdf8;
        color: var(--ink);
      }

      .capture-control {
        padding: 13px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border: 1px solid rgba(23, 42, 58, 0.12);
        border-radius: 14px 14px 14px 5px;
        background: rgba(255, 253, 248, 0.66);
      }

      .capture-copy strong,
      .capture-copy span {
        display: block;
      }

      .capture-copy strong {
        font-size: 12px;
      }

      .capture-copy span {
        margin-top: 2px;
        color: var(--ink-soft);
        font-size: 10px;
      }

      .capture-switch {
        width: 42px;
        height: 24px;
        position: relative;
        flex: 0 0 auto;
        appearance: none;
        border: 1px solid rgba(23, 42, 58, 0.24);
        border-radius: 999px;
        background: var(--paper-deep);
      }

      .capture-switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ink-soft);
        transition: transform 140ms ease;
      }

      .capture-switch:checked {
        background: var(--sage);
      }

      .capture-switch:checked::after {
        background: var(--blue-deep);
        transform: translateX(18px);
      }

      .footer {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .connection-label {
        color: var(--ink-soft);
        font-size: 9px;
        font-weight: 700;
      }

      .live-status {
        min-height: 16px;
        margin: 0;
        color: var(--ink-soft);
        font-size: 11px;
        text-align: right;
      }

      .live-status[data-tone='success'] {
        color: var(--blue-deep);
      }

      .live-status[data-tone='error'] {
        color: var(--red);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto;
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="popup-root">
      <header class="masthead">
        <div class="brand">
          <div class="rewind-mark" aria-hidden="true">↶</div>
          <div>
            <p class="brand-name">Easy Rewind</p>
            <p class="brand-subtitle">Local learning companion</p>
          </div>
        </div>
        <span class="privacy-flag">Local first</span>
      </header>

      <div class="track" aria-hidden="true"><span class="track-dot"></span></div>

      <main class="state-card" id="state-card" data-state="loading">
        <p class="eyebrow" id="state-eyebrow">Checking connection</p>
        <h1 class="state-title" id="state-title" tabindex="-1">Opening your rewind</h1>
        <p class="state-description" id="state-description">Looking for the Easy Rewind app on this computer.</p>

        <section class="page-summary" id="page-summary" aria-label="Current page" hidden>
          <p class="page-kicker">Current page</p>
          <p class="page-title" id="page-title"></p>
          <button class="page-link" type="button" data-action="open-page">Open page</button>
        </section>

        <div class="actions" id="state-actions" aria-label="Available actions"></div>

        <form class="connection-form" id="connection-form" hidden>
          <label for="desktop-connection-code">Desktop connection code</label>
          <div class="connection-row">
            <input
              class="connection-input"
              id="desktop-connection-code"
              type="password"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              required
              aria-describedby="connection-code-help"
            />
            <button class="action-button" type="submit">Connect</button>
          </div>
          <p class="brand-subtitle" id="connection-code-help">
            Copy this temporary code from the Easy Rewind desktop app.
          </p>
        </form>
      </main>

      <label class="capture-control" id="capture-control" hidden>
        <span class="capture-copy">
          <strong>Page capture</strong>
          <span>Always opt in. Sensitive pages stay excluded.</span>
        </span>
        <input
          class="capture-switch"
          id="capture-toggle"
          type="checkbox"
          data-action="toggle-capture"
          aria-label="Enable page capture"
        />
      </label>

      <footer class="footer">
        <span class="connection-label">Private by default</span>
        <p class="live-status" id="status-live" role="status" aria-live="polite" aria-atomic="true"></p>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
